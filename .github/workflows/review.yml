name: SF-001 review checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [sf001/pinned-audit]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install fixture dependencies
        run: Rscript -e 'install.packages(c("data.table", "dplyr", "tidyr", "jsonlite", "stringr", "openxlsx", "readxl"))'
      - name: Check R fixtures
        shell: bash
        run: |
          for fixture in audit/test_*.R; do
            Rscript "$fixture"
          done
      - name: Check Python fixtures and package contents
        run: |
          python3 -m unittest discover -s audit -p 'test_*.py'
          python3 audit/package_review.py HEAD "$RUNNER_TEMP/sf001-v0.1-review.tar.gz"
